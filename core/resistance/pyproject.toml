# CARD ingest and (later) resistance profiling. Standard library only, so the
# data layer never breaks on a dependency pin.
[project]
name = "htb-resistance"
version = "0.1.0"
description = "CARD ingest and resistance profiling for HTB26"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["htb_resistance"]
